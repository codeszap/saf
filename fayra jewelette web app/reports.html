<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fayra Jewelette - Business Analytics</title>
  <!-- Bootstrap 5.3 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="navigation.css">
</head>
<body>

  <div class="app-container">
    <main class="main-content container-fluid">
      <div class="row">
        <div class="col-12">
          <h1>Business Analytics</h1>
          <div class="subtitle">Atelier Revenue & Performance Reports</div>
        </div>
      </div>

      <!-- Stats Summaries -->
      <div class="row g-4 mb-4">
        <div class="col-12 col-md-6">
          <div class="glass-card h-100">
            <h4 style="color: var(--text-secondary); margin-bottom: 8px;">Quarterly Revenue</h4>
            <div style="font-size: 2rem; font-weight: 600; color: var(--color-gold);" id="totalRev">$0.00</div>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;" class="mb-0">Sum of all recorded catalog categories</p>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <div class="glass-card h-100">
            <h4 style="color: var(--text-secondary); margin-bottom: 8px;">Top Purity Segment</h4>
            <div style="font-size: 2rem; font-weight: 600; color: var(--text-primary);">24K Fine Gold</div>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;" class="mb-0">Accounting for 64% of luxury sales</p>
          </div>
        </div>
      </div>

      <!-- Charts & Visual Layout -->
      <div class="row g-4">
        <!-- Revenue Distribution SVG Bar Chart -->
        <div class="col-12 col-xl-6">
          <section class="glass-card h-100">
            <h3 style="margin-bottom: 20px; color: var(--color-gold);">Monthly Revenue Trend</h3>
            <div id="chartContainer" style="width: 100%; height: 250px; display: flex; align-items: flex-end; justify-content: space-around; padding-top: 20px; border-bottom: 2px solid var(--border-color);">
              <!-- Populated dynamically via reports.js -->
            </div>
            <div style="display: flex; justify-content: space-around; margin-top: 10px; color: var(--text-muted); font-size: 0.8rem;">
              <span>May</span>
              <span>Jun</span>
              <span>Jul</span>
              <span>Aug</span>
            </div>
          </section>
        </div>

        <!-- Category Contribution -->
        <div class="col-12 col-xl-6">
          <section class="glass-card h-100">
            <h3 style="margin-bottom: 20px; color: var(--color-gold);">Category Allocation</h3>
            <div id="categorySummaryList" style="display: flex; flex-direction: column; gap: 15px;">
              <!-- Dynamically populated categories listing and percentage fill bars -->
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="navigation.js"></script>
  <script src="reports.js"></script>
</body>
</html>
