<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fayra Jewelette - Stock Inventory</title>
  <!-- Bootstrap 5.3 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="navigation.css">
</head>
<body>

  <div class="app-container">
    <main class="main-content container-fluid">
      <div class="row">
        <div class="col-12">
          <h1>Stock Management</h1>
          <div class="subtitle">Live Vault Inventory Tracker</div>
        </div>
      </div>



      <!-- Filters & Action Bar -->
      <div class="row mb-4">
        <div class="col-12">
          <section class="glass-card">
            <div class="row g-3 align-items-center">
              <div class="col-12 col-md-8">
                <input type="text" id="searchStock" class="premium-input" placeholder="Search item name, code...">
              </div>
              <div class="col-12 col-md-4">
                <input list="filterCategoryList" id="filterCategory" class="premium-input" placeholder="Filter by category (e.g. All)">
                <datalist id="filterCategoryList">
                  <option value="All">All Categories</option>
                  <!-- Populated dynamically -->
                </datalist>
              </div>
            </div>
          </section>
        </div>
      </div>

      <!-- Vault Inventory Table -->
      <div class="row">
        <div class="col-12">
          <section class="glass-card">
            <div class="table-responsive">
              <table class="table table-dark table-borderless align-middle mb-0" style="background: transparent; font-size: 0.95rem;">
                <thead>
                  <tr style="border-bottom: 1px solid var(--border-color); color: var(--color-gold);">
                    <th style="padding: 14px; background: transparent;">Product Code</th>
                    <th style="padding: 14px; background: transparent;">Name</th>
                    <th style="padding: 14px; background: transparent;">Category</th>
                    <th style="padding: 14px; text-align: right; background: transparent;">Quantity</th>
                    <th style="padding: 14px; text-align: right; background: transparent;">Amount</th>
                    <th style="padding: 14px; text-align: center; background: transparent;">Actions</th>
                  </tr>
                </thead>
                <tbody id="stockTableBody" style="background: transparent;">
                  <!-- Dynamically populated from stocks.js -->
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </div>

      <!-- Simple Add Stock Dialog/Modal -->
      <div id="stockModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 200; justify-content: center; align-items: center;">
        <div class="glass-card" style="width: 90%; max-width: 480px; background: var(--bg-secondary);">
          <h3 style="margin-bottom: 20px; color: var(--color-gold);" id="stockModalTitle">Add Inventory Record</h3>
          <form id="addStockForm" class="d-flex flex-column gap-3">
            <div>
              <label class="form-label" style="font-size: 0.85rem; color: var(--text-secondary);">Name</label>
              <input type="text" id="newStockName" class="premium-input" placeholder="e.g. Royal Ruby Necklace" required>
            </div>
            <div>
              <label class="form-label" style="font-size: 0.85rem; color: var(--text-secondary);">Category</label>
              <input list="newStockCatList" id="newStockCat" class="premium-input" placeholder="Select or type..." required>
              <datalist id="newStockCatList">
                <!-- Dynamically populated categories -->
              </datalist>
            </div>
            <div class="row g-2">
              <div class="col-6">
                <label class="form-label" style="font-size: 0.85rem; color: var(--text-secondary);">Qty</label>
                <input type="number" id="newStockQty" class="premium-input" placeholder="5" required>
              </div>
              <div class="col-6">
                <label class="form-label" style="font-size: 0.85rem; color: var(--text-secondary);">Amount</label>
                <input type="number" step="0.01" id="newStockAmount" class="premium-input" placeholder="1000.00" required>
              </div>
            </div>
            <div class="d-flex gap-2 mt-3">
              <button type="submit" id="submitStockBtn" class="premium-btn flex-grow-1 justify-content-center">Add Stock</button>
              <button type="button" class="premium-btn justify-content-center" style="background: transparent; border: 1px solid var(--text-muted); color: var(--text-secondary);" onclick="toggleStockModal(false)">Cancel</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Floating Action Button -->
      <button onclick="toggleStockModal(true)" class="premium-btn" style="position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; font-size: 28px; display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 4px 15px rgba(197, 160, 89, 0.4); z-index: 100;">
        +
      </button>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="navigation.js"></script>
  <script src="stocks.js"></script>
</body>
</html>
