<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fayra Jewelette - Sales Registry</title>
  <!-- Bootstrap 5.3 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="navigation.css">
  <style>
    /* Mobile-responsive sales table */
    @media (max-width: 576px) {
      .sales-table th, .sales-table td {
        padding: 8px 4px !important;
        font-size: 0.78rem !important;
      }
      .sales-action-btns {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-end;
      }
      .glass-card {
        padding: 16px !important;
      }
    }
    .sale-edit-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 3px 7px;
      transition: background 0.2s;
    }
    .sale-edit-btn:hover { background: rgba(255,255,255,0.18); }
    .sale-del-btn {
      background: rgba(255,82,82,0.1);
      border: 1px solid rgba(255,82,82,0.3);
      border-radius: 4px;
      color: #ff5252;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 3px 7px;
      transition: background 0.2s;
    }
    .sale-del-btn:hover { background: rgba(255,82,82,0.25); }
  </style>
</head>
<body>

  <div class="app-container">
    <main class="main-content container-fluid">
      <div class="row">
        <div class="col-12">
          <h1>Sales Registry</h1>
          <div class="subtitle">Record and Track Sales</div>
        </div>
      </div>

      <div class="row g-4">
        <!-- Sales Form Card -->
        <div class="col-12 col-lg-5">
          <section class="glass-card">
            <h3 style="margin-bottom: 20px; color: var(--color-gold);">Record Sale</h3>
            
            <form id="billingForm" class="d-flex flex-column gap-3">
              <div>
                <label class="form-label" style="font-size: 0.85rem; color: var(--text-secondary);">Search Stock Name</label>
                <input list="stockNameList" id="itemName" class="premium-input" placeholder="Select or type..." required>
                <datalist id="stockNameList">
                  <!-- Dynamically populated from stocks -->
                </datalist>
              </div>
              
              <div class="row g-2">
                <div class="col-6">
                  <label class="form-label" style="font-size: 0.85rem; color: var(--text-secondary);">Available Qty</label>
                  <input type="number" id="availableQty" class="premium-input" placeholder="0" readonly style="background: rgba(255,255,255,0.05); color: var(--text-muted);">
                </div>
                <div class="col-6">
                  <label class="form-label" style="font-size: 0.85rem; color: var(--text-secondary);">Sell Qty</label>
                  <input type="number" id="sellQty" class="premium-input" placeholder="1" min="1" required>
                </div>
              </div>
              <div>
                <label class="form-label" style="font-size: 0.85rem; color: var(--text-secondary);">Sell Price (₹)</label>
                <input type="number" step="0.01" id="sellPrice" class="premium-input" placeholder="e.g. 5000" required>
              </div>

              <button type="submit" class="premium-btn w-100 justify-content-center mt-3">Save Sale</button>
            </form>
          </section>
        </div>

        <!-- Sales History -->
        <div class="col-12 col-lg-7">
          <section class="glass-card">
            <h3 style="margin-bottom: 20px; color: var(--color-gold);">Recent Sales</h3>
            <div class="table-responsive">
              <table class="table table-dark table-borderless align-middle mb-0 sales-table" style="background: transparent; font-size: 0.9rem;">
                <thead>
                  <tr style="border-bottom: 1px solid var(--border-color); color: var(--color-gold);">
                     <th style="padding: 10px 0; background: transparent;">Item Name</th>
                     <th style="padding: 10px 0; text-align: center; background: transparent;">Qty</th>
                     <th style="padding: 10px 0; text-align: right; background: transparent;">Price (₹)</th>
                     <th style="padding: 10px 0; text-align: center; background: transparent;">Date</th>
                     <th style="padding: 10px 0; text-align: right; background: transparent;">Actions</th>
                  </tr>
                </thead>
                <tbody id="invoiceTableBody" style="background: transparent;">
                  <!-- Dynamically populated rows -->
                </tbody>
              </table>
            </div>
          </section>
        </div>

      </div>

      <!-- Edit Sale Modal -->
      <div id="editSaleModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(5px); z-index:200; justify-content:center; align-items:center;">
        <div class="glass-card" style="width:90%; max-width:420px;">
          <h3 style="color:var(--color-gold); margin-bottom:18px;">Edit Sale</h3>
            <form id="editSaleForm" class="d-flex flex-column gap-3">
            <div>
              <label class="form-label" style="font-size:0.85rem; color:var(--text-secondary);">Item Name</label>
              <input type="text" id="editSaleName" class="premium-input" required>
            </div>
            <div class="row g-2">
              <div class="col-6">
                <label class="form-label" style="font-size:0.85rem; color:var(--text-secondary);">Sell Qty</label>
                <input type="number" id="editSaleQty" class="premium-input" min="1" required>
              </div>
              <div class="col-6">
                <label class="form-label" style="font-size:0.85rem; color:var(--text-secondary);">Sell Price (₹)</label>
                <input type="number" step="0.01" id="editSalePrice" class="premium-input" required>
              </div>
            </div>
            <div class="d-flex gap-2 mt-2">
              <button type="submit" class="premium-btn flex-grow-1 justify-content-center">Update</button>
              <button type="button" class="premium-btn justify-content-center" style="background:transparent; border:1px solid var(--text-muted); color:var(--text-secondary);" onclick="closeEditModal()">Cancel</button>
            </div>
          </form>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="navigation.js"></script>
  <script src="sales.js"></script>
</body>
</html>
