<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fayra Jewelette - Master Data</title>
  <!-- Bootstrap 5.3 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="navigation.css">
  <style>
    .fab-btn {
      position: fixed;
      bottom: 90px; /* clear bottom nav on mobile */
      right: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-gold) 0%, #b38944 100%);
      color: var(--bg-primary);
      border: none;
      box-shadow: 0 4px 20px rgba(197, 160, 89, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 97;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    @media (min-width: 992px) {
      .fab-btn {
        bottom: 40px;
      }
    }
    .fab-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 24px rgba(197, 160, 89, 0.6);
    }
    .fab-btn svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <main class="main-content container-fluid">
      <div class="row">
        <div class="col-12">
          <h1>Master Catalog</h1>
          <div class="subtitle">Atelier Catalog Configuration</div>
        </div>
      </div>

      <!-- Clean Categories Listing -->
      <div class="row g-4 justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <section class="glass-card">
            <h3 style="margin-bottom: 20px; color: var(--color-gold); border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">Jewelry Categories</h3>
            <ul id="categoryList" style="list-style: none; padding-left: 0; display: flex; flex-direction: column; gap: 10px;">
              <!-- Dynamic content from master.js -->
            </ul>
          </section>
        </div>
      </div>

      <!-- Floating Action Button -->
      <button class="fab-btn" onclick="toggleMasterModal(true)" title="Create Category">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <!-- Custom Create Data Modal -->
      <div id="masterModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 1050; justify-content: center; align-items: center;">
        <div class="glass-card" style="width: 90%; max-width: 400px; background: var(--bg-secondary);">
          <h3 id="modalTitle" style="margin-bottom: 20px; color: var(--color-gold); text-align: center;">New Jewelry Category</h3>

          <!-- Category Form -->
          <form id="categoryForm" class="d-flex flex-column gap-3">
            <div>
              <label class="form-label" style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px;">Category Name</label>
              <input type="text" id="catName" class="premium-input" placeholder="e.g. Gemstone Brooches" required>
            </div>
            <div class="d-flex gap-2 mt-3">
              <button type="submit" id="submitBtn" class="premium-btn flex-grow-1 justify-content-center">Save</button>
              <button type="button" class="premium-btn justify-content-center" style="background: transparent; border: 1px solid var(--text-muted); color: var(--text-secondary);" onclick="toggleMasterModal(false)">Cancel</button>
            </div>
          </form>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="navigation.js"></script>
  <script src="master.js"></script>
</body>
</html>
