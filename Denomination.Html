<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8" />
    <title>Denominations Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0b132b',
                        cardBg: '#1c2541',
                        accentCyan: '#38bdf8',
                        accentEmerald: '#10b981',
                        accentRose: '#f43f5e',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbars and touch optimizations */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        input {
            user-select: auto;
        }
        /* Hide spin buttons on number inputs */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        /* Glassmorphism subtle effects */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
        }

        body {
            height: auto !important;
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            align-items: flex-start !important;
        }

        .app-shell {
            height: auto !important;
            min-height: 100dvh;
            overflow: visible !important;
            justify-content: flex-start !important;
            gap: 12px;
            padding: 12px;
            border-left: 0;
            border-right: 0;
        }

        .app-shell > header {
            min-height: 40px;
            padding: 4px 2px;
        }

        .app-shell > header h1 {
            font-size: 16px;
        }

        .app-shell > header #dateDisplay {
            font-size: 12px;
            padding: 5px 9px;
        }

        .app-shell > .glass-card {
            border-radius: 12px;
            padding: 10px 12px;
        }

        .app-shell > .glass-card label {
            font-size: 12px;
        }

        .app-shell > .glass-card input {
            min-height: 40px;
            font-size: 16px;
        }

        .app-shell main {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            flex: none !important;
            justify-content: initial !important;
            gap: 8px;
            padding: 0;
            overflow: visible !important;
        }

        .app-shell main > .glass-card {
            display: grid !important;
            grid-template-columns: minmax(0, 1fr) minmax(48px, 0.8fr);
            grid-template-rows: auto auto;
            align-content: center;
            gap: 6px 4px;
            width: 100%;
            height: auto !important;
            min-height: 68px;
            padding: 8px !important;
            border-radius: 12px;
        }

        .app-shell main > .glass-card > div {
            width: auto !important;
            min-width: 0;
            gap: 4px;
        }

        .app-shell main > .glass-card > div > span:first-child {
            font-size: 13px;
        }

        .app-shell main > .glass-card > input {
            grid-column: 2;
            grid-row: 1;
            width: 100%;
            min-width: 0;
            max-width: none !important;
            height: 36px;
            padding: 4px 6px;
            font-size: 16px;
        }

        .app-shell main > .glass-card > span {
            grid-column: 1 / -1;
            grid-row: 2;
            min-width: 0;
            font-size: 12px;
            text-align: left;
        }

        #result {
            min-height: 68px;
            border-radius: 14px;
        }

        #result > div:not(.h-6) > div:last-child {
            font-size: 18px;
        }

        .app-shell footer {
            position: sticky;
            bottom: 0;
            z-index: 10;
            padding: 8px 0 max(8px, env(safe-area-inset-bottom));
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(12px);
        }

        .app-shell footer button {
            min-height: 46px;
            font-size: 14px;
        }

        @media (max-width: 360px) {
            .app-shell {
                padding: 10px;
            }

            .app-shell main {
                grid-template-columns: 1fr;
                gap: 7px;
            }

            .app-shell main > .glass-card {
                grid-template-columns: minmax(0, 1fr) minmax(70px, 0.7fr) minmax(76px, auto);
                grid-template-rows: auto;
                min-height: 56px;
                padding: 8px 10px !important;
            }

            .app-shell main > .glass-card > input {
                grid-column: 2;
                grid-row: 1;
            }

            .app-shell main > .glass-card > span {
                grid-column: 3;
                grid-row: 1;
                text-align: right;
            }
        }

        body {
            background: #f2f2f2 !important;
            color: #111 !important;
            align-items: flex-start !important;
            font-family: Arial, sans-serif !important;
        }

        body.w-screen {
            width: 100% !important;
        }

        .app-shell {
            width: 100%;
            max-width: 760px;
            min-height: 100dvh;
            margin: 0 auto;
            padding: 0 16px 104px;
            gap: 0;
            background: #fff !important;
            color: #111 !important;
            box-shadow: none !important;
        }

        .app-shell.app-shell {
            padding: 0 16px 104px !important;
        }

        .app-shell > header {
            box-sizing: border-box;
            min-height: 64px;
            margin: 0 -12px;
            padding: 0 16px;
            background: #172554;
            color: #fff;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.16);
        }

        .app-shell > header h1 {
            overflow: hidden;
            color: #fff !important;
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.01em;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .app-shell > header > div:first-child > div {
            display: none;
        }

        .app-shell > header #dateDisplay {
            display: none !important;
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar-action {
            display: grid;
            width: 38px;
            height: 38px;
            padding: 8px;
            place-items: center;
            border: 0;
            border-radius: 10px;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: background-color 150ms ease, transform 150ms ease;
        }

        .toolbar-action:hover,
        .toolbar-action:focus-visible {
            background: rgba(255, 255, 255, 0.2);
        }

        .toolbar-action:active {
            transform: scale(0.94);
        }

        .toolbar-action svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .top-summary {
            display: grid;
            gap: 0;
            padding: 18px 0 8px;
        }

        .summary-line {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            font-size: clamp(15px, 4vw, 21px);
            font-weight: 700;
        }

        .summary-line strong {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .system-amount-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            align-items: center;
            gap: 8px;
            position: fixed;
            z-index: 20;
            right: 0;
            bottom: 0;
            left: 0;
            width: min(calc(100% - 32px), 728px);
            margin: 0 auto;
            padding: 10px 12px max(10px, env(safe-area-inset-bottom));
            border-top: 1px solid #e5e5e5;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.08);
        }

        .system-amount-group,
        .total-amount-group,
        .balance-group {
            display: flex;
            min-width: 0;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
        }

        .system-amount-row label,
        .system-amount-row .summary-label {
            color: #333 !important;
            font-size: 12px !important;
            font-weight: 700;
        }

        .system-input-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            width: 100%;
        }

        .system-input-wrap > span {
            color: #333;
            font-size: 15px;
            font-weight: 700;
        }

        .system-amount-row input {
            width: 74px;
            min-width: 0;
            min-height: 36px;
            padding: 4px !important;
            border: 0 !important;
            border-bottom: 1px solid #777 !important;
            border-radius: 0 !important;
            color: #111 !important;
            background: #fff !important;
            font-size: 16px !important;
            text-align: center;
        }

        .total-amount-value,
        .balance-value {
            color: #111;
            font-size: 16px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .balance-good .balance-value { color: #059669 !important; }
        .balance-negative .balance-value { color: #e11d48 !important; }
        .balance-pending .balance-value { color: #b45309 !important; }

        .app-shell main {
            display: flex !important;
            flex: none !important;
            flex-direction: column;
            gap: 0;
            padding: 0;
            overflow: visible !important;
        }

        .table-head {
            display: grid;
            grid-template-columns: 1fr 0.9fr 1.25fr;
            align-items: center;
            min-height: 42px;
            padding: 0 12px;
            border-bottom: 1px solid #e2e8f0;
            border-radius: 8px 8px 0 0;
            color: #475569;
            background: #f1f5f9;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .table-head span:nth-child(2) {
            text-align: center;
        }

        .table-head span:last-child {
            text-align: right;
        }

        .app-shell main > .glass-card {
            display: grid !important;
            grid-template-columns: 1fr 0.9fr 1.25fr;
            grid-template-rows: auto;
            align-items: center;
            gap: 8px;
            width: 100%;
            min-height: 64px;
            padding: 8px 12px !important;
            border: 0;
            border-bottom: 1px solid #d8d8d8;
            border-radius: 0;
            background: #fff !important;
            box-shadow: none;
            backdrop-filter: none;
        }

        .app-shell main > .glass-card > div {
            width: auto !important;
            min-width: 0;
            gap: 4px;
        }

        .app-shell main > .glass-card > div > span:first-child {
            color: #111 !important;
            font-size: 17px;
            font-weight: 700;
        }

        .app-shell main > .glass-card > div > span:first-child:not(.text-amber-400)::before {
            content: "₹ ";
        }

        .app-shell main > .glass-card > div > span:nth-child(2) {
            display: none;
        }

        .app-shell main > .glass-card > input {
            grid-column: 2;
            grid-row: 1;
            width: 100%;
            min-width: 0;
            max-width: none !important;
            height: 40px;
            padding: 4px 8px !important;
            border: 1px solid #cbd5e1 !important;
            border-radius: 8px !important;
            color: #111 !important;
            background: #f8fafc !important;
            font-size: 18px !important;
            text-align: center !important;
        }

        .app-shell main > .glass-card > input:focus {
            border-color: #2563eb !important;
            outline: 2px solid rgba(37, 99, 235, 0.16);
        }

        .app-shell main > .glass-card > span {
            grid-column: 3;
            grid-row: 1;
            min-width: 0;
            color: #047857 !important;
            font-size: 16px;
            font-weight: 700;
            text-align: right;
            white-space: nowrap;
        }

        .app-shell footer {
            display: none !important;
        }

        @media (max-width: 420px) {
            .app-shell {
                padding-right: 12px;
                padding-left: 12px;
            }

            .app-shell.app-shell {
                padding-right: 12px !important;
                padding-left: 12px !important;
            }

            .app-shell > header {
                margin-right: -12px;
                margin-left: -12px;
                padding-right: 10px;
                padding-left: 12px;
            }

            .toolbar-actions {
                gap: 0;
            }

            .toolbar-action {
                width: 38px;
            }

            .system-amount-row { gap: 5px; }

            .system-amount-row label,
            .system-amount-row .summary-label {
                font-size: 11px !important;
            }

            .system-amount-row input {
                width: 52px;
                padding-right: 2px !important;
                padding-left: 2px !important;
                font-size: 16px !important;
            }

            .total-amount-value,
            .balance-value {
                font-size: 14px;
            }

            .app-shell main > .glass-card,
            .table-head {
                grid-template-columns: minmax(88px, 1fr) minmax(72px, 0.85fr) minmax(100px, 1.15fr);
                gap: 6px;
                padding-right: 8px !important;
                padding-left: 8px !important;
            }

            .app-shell main > .glass-card > div > span:first-child {
                font-size: 15px;
            }

            .app-shell main > .glass-card > span {
                font-size: 14px;
            }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen h-[100dvh] w-screen overflow-hidden flex justify-center items-center antialiased">

    <!-- App Main Container -->
    <div class="app-shell w-full h-full max-w-md mx-auto flex flex-col justify-between p-2 sm:p-3 bg-slate-900 border-x border-slate-800 shadow-2xl relative overflow-hidden">

        <!-- Toast Notification -->
        <div id="toast" class="absolute top-3 left-1/2 -translate-x-1/2 z-50 bg-emerald-500 text-slate-950 font-bold px-3 py-1 rounded-full text-[11px] shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
            <span id="toastMsg">Saved successfully!</span>
        </div>

        <!-- Custom Confirmation Modal -->
        <div id="confirmModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 max-w-xs w-full text-center shadow-2xl scale-95 transition-transform duration-200" id="confirmBox">
                <div class="w-10 h-10 bg-rose-500/10 text-rose-400 rounded-full flex items-center justify-center mx-auto mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </div>
                <h3 class="text-base font-bold text-slate-100 mb-1">Clear Data?</h3>
                <p class="text-xs text-slate-400 mb-4">Are you sure you want to reset all denomination inputs and system amount?</p>
                <div class="flex gap-2">
                    <button id="cancelModalBtn" class="flex-1 py-1.5 px-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold active:scale-95 transition-all">Cancel</button>
                    <button id="confirmClearBtn" class="flex-1 py-1.5 px-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold active:scale-95 transition-all">Clear All</button>
                </div>
            </div>
        </div>

        <!-- Header Section -->
        <header class="flex justify-between items-center py-0.5 px-1 shrink-0">
            <h1 id="summaryDate">--/--/----</h1>
            <div class="toolbar-actions">
                <button id="saveBtn" class="toolbar-action" type="button" aria-label="Save" title="Save">
                    <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l7 7v9a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                </button>
                <button id="shareBtn" class="toolbar-action" type="button" aria-label="Share" title="Share">
                    <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"></line></svg>
                </button>
                <button id="clearBtn" class="toolbar-action" type="button" aria-label="Clear all" title="Clear all">
                    <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </div>
        </header>

        <!-- System amount, total, and balance -->
        <nav class="system-amount-row" aria-label="Amount summary">
            <div class="system-amount-group">
                <label for="systemAmount">System Amount</label>
                <div class="system-input-wrap">
                    <span>₹</span>
                    <input type="number" id="systemAmount" autocomplete="off" min="0" placeholder="0" />
                </div>
            </div>
            <div class="total-amount-group">
                <span class="summary-label">Total Amount</span>
                <strong class="total-amount-value">₹<span id="grandTotal">0</span></strong>
            </div>
            <div class="balance-group balance-pending" id="balanceBox">
                <span class="summary-label">Balance</span>
                <strong class="balance-value">₹<span id="balance">0</span></strong>
            </div>
        </nav>

        <!-- Single Column Denominations List (No-scroll fit) -->
        <main class="flex-1 flex flex-col justify-between py-1 overflow-hidden">
            <div class="table-head" aria-hidden="true">
                <span>Currency</span>
                <span>Count</span>
                <span>Amount</span>
            </div>

            <!-- Row 2000 -->
            <div class="glass-card rounded-md px-2 py-0.5 flex items-center justify-between border border-slate-800/80 gap-2 h-[8.5%]">
                <div class="flex items-center gap-1 w-20 shrink-0">
                    <span class="text-xs font-bold text-slate-200">2000</span>
                    <span class="text-[10px] font-semibold text-slate-500">×</span>
                </div>
                <input type="number" id="note2000" min="0" placeholder="×" aria-label="Count of 2000 rupee notes" class="glass-input flex-1 max-w-[90px] py-0.5 px-2 text-right font-bold text-xs text-white rounded outline-none h-6" />
                <span class="text-xs font-semibold text-emerald-400 text-right font-mono min-w-[75px]">₹<span id="total2000">0</span></span>
            </div>

            <!-- Row 500 -->
            <div class="glass-card rounded-md px-2 py-0.5 flex items-center justify-between border border-slate-800/80 gap-2 h-[8.5%]">
                <div class="flex items-center gap-1 w-20 shrink-0">
                    <span class="text-xs font-bold text-slate-200">500</span>
                    <span class="text-[10px] font-semibold text-slate-500">×</span>
                </div>
                <input type="number" id="note500" min="0" placeholder="×" aria-label="Count of 500 rupee notes" class="glass-input flex-1 max-w-[90px] py-0.5 px-2 text-right font-bold text-xs text-white rounded outline-none h-6" />
                <span class="text-xs font-semibold text-emerald-400 text-right font-mono min-w-[75px]">₹<span id="total500">0</span></span>
            </div>

            <!-- Row 200 -->
            <div class="glass-card rounded-md px-2 py-0.5 flex items-center justify-between border border-slate-800/80 gap-2 h-[8.5%]">
                <div class="flex items-center gap-1 w-20 shrink-0">
                    <span class="text-xs font-bold text-slate-200">200</span>
                    <span class="text-[10px] font-semibold text-slate-500">×</span>
                </div>
                <input type="number" id="note200" min="0" placeholder="×" aria-label="Count of 200 rupee notes" class="glass-input flex-1 max-w-[90px] py-0.5 px-2 text-right font-bold text-xs text-white rounded outline-none h-6" />
                <span class="text-xs font-semibold text-emerald-400 text-right font-mono min-w-[75px]">₹<span id="total200">0</span></span>
            </div>

            <!-- Row 100 -->
            <div class="glass-card rounded-md px-2 py-0.5 flex items-center justify-between border border-slate-800/80 gap-2 h-[8.5%]">
                <div class="flex items-center gap-1 w-20 shrink-0">
                    <span class="text-xs font-bold text-slate-200">100</span>
                    <span class="text-[10px] font-semibold text-slate-500">×</span>
                </div>
                <input type="number" id="note100" min="0" placeholder="×" aria-label="Count of 100 rupee notes" class="glass-input flex-1 max-w-[90px] py-0.5 px-2 text-right font-bold text-xs text-white rounded outline-none h-6" />
                <span class="text-xs font-semibold text-emerald-400 text-right font-mono min-w-[75px]">₹<span id="total100">0</span></span>
            </div>

            <!-- Row 50 -->
            <div class="glass-card rounded-md px-2 py-0.5 flex items-center justify-between border border-slate-800/80 gap-2 h-[8.5%]">
                <div class="flex items-center gap-1 w-20 shrink-0">
                    <span class="text-xs font-bold text-slate-200">50</span>
                    <span class="text-[10px] font-semibold text-slate-500">×</span>
                </div>
                <input type="number" id="note50" min="0" placeholder="×" aria-label="Count of 50 rupee notes" class="glass-input flex-1 max-w-[90px] py-0.5 px-2 text-right font-bold text-xs text-white rounded outline-none h-6" />
                <span class="text-xs font-semibold text-emerald-400 text-right font-mono min-w-[75px]">₹<span id="total50">0</span></span>
            </div>

            <!-- Row 20 -->
            <div class="glass-card rounded-md px-2 py-0.5 flex items-center justify-between border border-slate-800/80 gap-2 h-[8.5%]">
                <div class="flex items-center gap-1 w-20 shrink-0">
                    <span class="text-xs font-bold text-slate-200">20</span>
                    <span class="text-[10px] font-semibold text-slate-500">×</span>
                </div>
                <input type="number" id="note20" min="0" placeholder="×" aria-label="Count of 20 rupee notes" class="glass-input flex-1 max-w-[90px] py-0.5 px-2 text-right font-bold text-xs text-white rounded outline-none h-6" />
                <span class="text-xs font-semibold text-emerald-400 text-right font-mono min-w-[75px]">₹<span id="total20">0</span></span>
            </div>

            <!-- Row 10 -->
            <div class="glass-card rounded-md px-2 py-0.5 flex items-center justify-between border border-slate-800/80 gap-2 h-[8.5%]">
                <div class="flex items-center gap-1 w-20 shrink-0">
                    <span class="text-xs font-bold text-slate-200">10</span>
                    <span class="text-[10px] font-semibold text-slate-500">×</span>
                </div>
                <input type="number" id="note10" min="0" placeholder="×" aria-label="Count of 10 rupee notes" class="glass-input flex-1 max-w-[90px] py-0.5 px-2 text-right font-bold text-xs text-white rounded outline-none h-6" />
                <span class="text-xs font-semibold text-emerald-400 text-right font-mono min-w-[75px]">₹<span id="total10">0</span></span>
            </div>

            <!-- Row 5 -->
            <div class="glass-card rounded-md px-2 py-0.5 flex items-center justify-between border border-slate-800/80 gap-2 h-[8.5%]">
                <div class="flex items-center gap-1 w-20 shrink-0">
                    <span class="text-xs font-bold text-slate-200">5</span>
                    <span class="text-[10px] font-semibold text-slate-500">×</span>
                </div>
                <input type="number" id="note5" min="0" placeholder="×" aria-label="Count of 5 rupee coins" class="glass-input flex-1 max-w-[90px] py-0.5 px-2 text-right font-bold text-xs text-white rounded outline-none h-6" />
                <span class="text-xs font-semibold text-emerald-400 text-right font-mono min-w-[75px]">₹<span id="total5">0</span></span>
            </div>

            <!-- Row 2 -->
            <div class="glass-card rounded-md px-2 py-0.5 flex items-center justify-between border border-slate-800/80 gap-2 h-[8.5%]">
                <div class="flex items-center gap-1 w-20 shrink-0">
                    <span class="text-xs font-bold text-slate-200">2</span>
                    <span class="text-[10px] font-semibold text-slate-500">×</span>
                </div>
                <input type="number" id="note2" min="0" placeholder="×" aria-label="Count of 2 rupee coins" class="glass-input flex-1 max-w-[90px] py-0.5 px-2 text-right font-bold text-xs text-white rounded outline-none h-6" />
                <span class="text-xs font-semibold text-emerald-400 text-right font-mono min-w-[75px]">₹<span id="total2">0</span></span>
            </div>

            <!-- Row 1 -->
            <div class="glass-card rounded-md px-2 py-0.5 flex items-center justify-between border border-slate-800/80 gap-2 h-[8.5%]">
                <div class="flex items-center gap-1 w-20 shrink-0">
                    <span class="text-xs font-bold text-slate-200">1</span>
                    <span class="text-[10px] font-semibold text-slate-500">×</span>
                </div>
                <input type="number" id="note1" min="0" placeholder="×" aria-label="Count of 1 rupee coins" class="glass-input flex-1 max-w-[90px] py-0.5 px-2 text-right font-bold text-xs text-white rounded outline-none h-6" />
                <span class="text-xs font-semibold text-emerald-400 text-right font-mono min-w-[75px]">₹<span id="total1">0</span></span>
            </div>

            <!-- Row Acc / Coins -->
            <div class="glass-card rounded-md px-2 py-0.5 flex items-center justify-between border border-slate-800/80 gap-2 h-[8.5%]">
                <div class="flex items-center gap-1 w-20 shrink-0">
                    <span class="text-xs font-bold text-amber-400 truncate">Acc / Coins</span>
                    <span class="text-[10px] font-semibold text-slate-500">×</span>
                </div>
                <input type="number" id="coins" min="0" placeholder="×" aria-label="Count of other coins" class="glass-input flex-1 max-w-[90px] py-0.5 px-2 text-right font-bold text-xs text-white rounded outline-none h-6" />
                <span class="text-xs font-semibold text-emerald-400 text-right font-mono min-w-[75px]">₹<span id="totalCoins">0</span></span>
            </div>
        </main>

    </div>

    <!-- Application Script -->
    <script>
        // Standard denomination definitions
        const denominations = [
            { id: 'note2000', value: 2000 },
            { id: 'note500', value: 500 },
            { id: 'note200', value: 200 },
            { id: 'note100', value: 100 },
            { id: 'note50', value: 50 },
            { id: 'note20', value: 20 },
            { id: 'note10', value: 10 },
            { id: 'note5', value: 5 },
            { id: 'note2', value: 2 },
            { id: 'note1', value: 1 }
        ];

        // Format numbers to Indian currency standard string
        function formatNumber(num) {
            return num.toLocaleString('en-IN');
        }

        // Calculation logic
        function calculate() {
            let total = 0;
            
            // Calculate note totals
            denominations.forEach(denom => {
                const count = parseInt(document.getElementById(denom.id).value) || 0;
                const amount = denom.value * count;
                const totalElem = document.getElementById('total' + denom.id.replace('note', ''));
                if (totalElem) {
                    totalElem.textContent = formatNumber(amount);
                }
                total += amount;
            });

            // Calculate coins / custom amount
            const coinsCount = parseInt(document.getElementById('coins').value) || 0;
            const coinsAmount = coinsCount;
            document.getElementById('totalCoins').textContent = formatNumber(coinsAmount);
            total += coinsAmount;

            // Grand total display
            document.getElementById('grandTotal').textContent = formatNumber(total);

            // System Amount & Balance display logic
            const systemAmt = parseInt(document.getElementById('systemAmount').value) || 0;
            const balance = systemAmt - total;
            const balanceBox = document.getElementById('balanceBox');

            document.getElementById('balance').textContent = formatNumber(balance);

            // Dynamic color feedback for balance state
            balanceBox.classList.remove('balance-good', 'balance-negative', 'balance-pending');
            if (systemAmt > 0 && balance === 0) {
                balanceBox.classList.add('balance-good');
            } else if (balance < 0) {
                balanceBox.classList.add('balance-negative');
            } else {
                balanceBox.classList.add('balance-pending');
            }
        }

        // Show formatted current date
        function showCurrentDate() {
            const now = new Date();
            document.getElementById('summaryDate').textContent = now.toLocaleDateString('en-IN', {
                weekday: 'short',
                day: '2-digit',
                month: 'short',
                year: '2-digit'
            });
        }

        // Save input values to LocalStorage
        function saveToLocalStorage(showToastNotification = false) {
            const data = {};
            denominations.forEach(denom => {
                data[denom.id] = document.getElementById(denom.id).value;
            });
            data['coins'] = document.getElementById('coins').value;
            data['systemAmount'] = document.getElementById('systemAmount').value;
            localStorage.setItem('denominationsData', JSON.stringify(data));

            if (showToastNotification) {
                showToast("Data saved successfully!");
            }
        }

        // Load input values from LocalStorage
        function loadFromLocalStorage() {
            const storedData = localStorage.getItem('denominationsData');
            if (storedData) {
                try {
                    const data = JSON.parse(storedData);
                    Object.keys(data).forEach(key => {
                        const el = document.getElementById(key);
                        if (el) el.value = data[key];
                    });
                    calculate();
                } catch (e) {
                    console.error("Error reading saved data", e);
                }
            }
        }

        // Modal management for clearing data
        const confirmModal = document.getElementById('confirmModal');
        const confirmBox = document.getElementById('confirmBox');

        function openModal() {
            confirmModal.classList.remove('opacity-0', 'pointer-events-none');
            confirmBox.classList.remove('scale-95');
            confirmBox.classList.add('scale-100');
        }

        function closeModal() {
            confirmModal.classList.add('opacity-0', 'pointer-events-none');
            confirmBox.classList.remove('scale-100');
            confirmBox.classList.add('scale-95');
        }

        function clearLocalStorage() {
            localStorage.removeItem('denominationsData');
            denominations.forEach(denom => {
                const el = document.getElementById(denom.id);
                if (el) el.value = '';
            });
            document.getElementById('coins').value = '';
            document.getElementById('systemAmount').value = '';
            calculate();
            closeModal();
            showToast("All data cleared!");
        }

        // Toast feedback implementation
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = message;
            
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2000);
        }

        async function shareSummary() {
            const summary = [
                `Date: ${document.getElementById('summaryDate').textContent}`,
                `Total Amount: ₹${document.getElementById('grandTotal').textContent}`,
                ...denominations.map(denom => {
                    const count = parseInt(document.getElementById(denom.id).value) || 0;
                    return `${formatNumber(denom.value)} × ${count} = ₹${formatNumber(denom.value * count)}`;
                }),
                `Acc / Coins: ${document.getElementById('coins').value || 0} = ₹${document.getElementById('totalCoins').textContent}`
            ].join('\n');

            try {
                if (navigator.share) {
                    await navigator.share({ title: 'Denomination Summary', text: summary });
                } else if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(summary);
                    showToast('Summary copied!');
                } else {
                    const textArea = document.createElement('textarea');
                    textArea.value = summary;
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-9999px';
                    document.body.appendChild(textArea);
                    textArea.select();
                    const copied = document.execCommand('copy');
                    textArea.remove();
                    if (!copied) throw new Error('Clipboard copy was not available');
                    showToast('Summary copied!');
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.error('Unable to share denomination summary:', error);
                    showToast('Unable to share summary');
                }
            }
        }

        // Event Listeners setup
        document.getElementById('saveBtn').addEventListener('click', () => saveToLocalStorage(true));
        document.getElementById('shareBtn').addEventListener('click', shareSummary);
        document.getElementById('clearBtn').addEventListener('click', openModal);
        document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
        document.getElementById('confirmClearBtn').addEventListener('click', clearLocalStorage);

        // Attach listeners to input fields
        const allInputs = [...denominations.map(d => d.id), 'coins', 'systemAmount'];
        allInputs.forEach(id => {
            const elem = document.getElementById(id);
            if (elem) {
                elem.addEventListener('input', () => {
                    calculate();
                    saveToLocalStorage(false);
                });
                // Auto-select text on focus for fast mobile typing
                elem.addEventListener('focus', function() {
                    this.select();
                });
            }
        });

        // Initialize application on load
        window.addEventListener('DOMContentLoaded', () => {
            showCurrentDate();
            loadFromLocalStorage();
            calculate();
        });
    </script>
</body>
</html>
