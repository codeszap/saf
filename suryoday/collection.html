<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today Collection</title>
  <style>
    :root {
      --bg-light: #F4F7FB;
      --card-bg: rgba(255, 255, 255, 0.96);
      --header-bg: #172554;
      --header-text: #F8FAFC;
      --accent-blue: #4F46E5;
      --badge-total-bg: #DDF7EE;
      --badge-total-text: #087A60;
      --accent-green: #079669;
      --accent-purple: #7C3AED;
      --accent-red: #E5484D;
      --text-primary: #182230;
      --text-secondary: #738095;
      --border-color: #E7ECF3;
      --nav-bg: rgba(255, 255, 255, 0.94);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        radial-gradient(circle at 12% 0%, rgba(79, 70, 229, 0.07), transparent 28%),
        radial-gradient(circle at 88% 18%, rgba(20, 184, 166, 0.06), transparent 24%),
        var(--bg-light);
      color: var(--text-primary);
      padding: 14px;
      padding-bottom: 88px;
      min-height: 100vh;
      user-select: none;
    }

    .view-screen {
      max-width: 450px;
      margin: 0 auto;
    }

    /* Refined Group Card */
    .date-group-card {
      background-color: var(--card-bg);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 8px;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(31, 41, 55, 0.07);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .date-group-card:hover {
      box-shadow: 0 12px 28px rgba(31, 41, 55, 0.09);
    }

    /* Dark Header Bar */
    .date-header {
      background: linear-gradient(135deg, #1E293B 0%, #312E81 100%);
      padding: 13px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .date-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .collapse-toggle {
      width: 24px;
      height: 24px;
      padding: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: #E2E8F0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .collapse-toggle svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.2s ease;
    }

    .collapse-toggle.collapsed svg {
      transform: rotate(-90deg);
    }

    .date-header .date-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 850;
      color: #F8FAFC;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .card-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0;
    }

    /* Total Amount Badge */
    .date-header .total-amount {
      font-size: 13px;
      font-weight: 900;
      color: #FFFFFF;
      background: none;
      padding: 7px 0;
      border-radius: 999px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    /* Bulk Action Header Bar */
    .bulk-actions-bar {
      display: none;
      background-color: #F1F5F9;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-color);
      justify-content: space-between;
      align-items: center;
    }

    .bulk-actions-bar.active {
      display: flex;
    }

    .btn-bulk-action {
      background: none;
      border: none;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-select-all {
      color: var(--accent-blue);
    }

    .btn-delete-selected {
      color: var(--accent-red);
    }

    .btn-cancel-select {
      color: var(--text-secondary);
    }

    /* Entry List Container */
    .entry-list {
      padding: 4px 12px;
    }

    .entry-list.collapsed {
      display: none;
    }

    /* Entry Row Item - Flexible & Protected Layout */
    .entry-swipe-container {
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border-color);
    }

    .entry-swipe-container:last-child {
      border-bottom: none;
    }

    .entry-item {
      position: relative;
      z-index: 1;
      padding: 13px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px; /* Space between left and right sections */
      text-transform: uppercase;
      cursor: pointer;
      background: var(--card-bg);
      transition: background-color 0.15s ease, transform 0.2s ease;
      touch-action: pan-y;
    }

    .entry-swipe-container.swipe-open .entry-item {
      transform: translateX(180px);
    }

    .swipe-actions {
      position: absolute;
      inset: 0 auto 0 0;
      width: 180px;
      display: flex;
      align-items: stretch;
      background: #E8EDF5;
      visibility: hidden;
      pointer-events: none;
    }

    .entry-swipe-container.swipe-open .swipe-actions {
      visibility: visible;
      pointer-events: auto;
    }

    .swipe-action {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: none;
      color: #FFFFFF;
      background: var(--accent-blue);
      font-size: 9px;
      font-weight: 800;
      cursor: pointer;
    }

    .swipe-action.toggle-total {
      background: #0D9488;
    }

    .swipe-action.toggle-total.excluded {
      background: #64748B;
    }

    .swipe-action.edit-action {
      background: #475569;
    }

    .swipe-action.delete-action {
      background: var(--accent-red);
    }

    .swipe-action svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .entry-item.selected {
      background: linear-gradient(90deg, #FFF1F2, #FFFFFF);
      border-radius: 12px;
    }

    .entry-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0; /* Prevents text overflow from pushing right column out */
      flex: 1;
    }

    .select-checkbox {
      display: none;
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--accent-red);
      flex-shrink: 0;
    }

    .select-checkbox.show {
      display: inline-block;
    }

    .entry-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      flex: 1;
    }

    .entry-info h4 {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis; /* Clean truncation for extremely long names */
    }

    /* Wrap Long Descriptions inside Badge cleanly */
    .type-badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      color: var(--text-secondary);
      background: #F4F7FB;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid #E2E8F0;
      width: fit-content;
      max-width: 100%;
      word-break: break-word; /* Wraps continuous long string without hiding action icons */
      white-space: normal;
    }

    /* Prevent right action column from shrinking or getting pushed out */
    .entry-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0; /* Ensures amount and icons never hide */
    }

    .entry-amount {
      font-weight: 900;
      font-size: 15px;
      color: var(--accent-green);
      white-space: nowrap;
    }

    .action-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
    }

    .icon-btn:hover {
      color: var(--accent-blue);
    }

    .icon-btn.delete-btn:hover {
      color: var(--accent-red);
    }

    .icon-btn.total-toggle-btn.excluded {
      color: var(--accent-red);
    }

    .icon-btn svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .no-records {
      text-align: center;
      color: var(--text-secondary);
      margin-top: 50px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Floating Menu and Action Buttons */
    .bottom-nav {
      display: none;
    }

    .floating-actions {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 10px;
      z-index: 900;
    }

    .fab {
      width: 54px;
      height: 54px;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #FFFFFF;
      background: linear-gradient(135deg, #4F46E5, #6366F1);
      box-shadow: 0 10px 24px rgba(79, 70, 229, 0.32);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .fab:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(79, 70, 229, 0.38);
    }

    .fab svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fab-main {
      width: 62px;
      height: 62px;
    }

    .fab-menu {
      display: none;
      width: 48px;
      height: 48px;
      background: #FFFFFF;
      color: var(--text-primary);
      box-shadow: 0 8px 20px rgba(31, 41, 55, 0.16);
    }

    .fab-menu.open {
      display: flex;
      animation: fabPop 0.16s ease-out;
    }

    .fab-main svg {
      transition: transform 0.2s ease;
    }

    .fab-main.open svg {
      transform: rotate(45deg);
    }

    @keyframes fabPop {
      from { opacity: 0; transform: scale(0.75) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 1000;
    }

    .form-card {
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 420px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: var(--bg-light);
      border: 1px solid var(--border-color);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      color: var(--text-secondary);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-card h2 {
      margin-bottom: 16px;
      color: var(--text-primary);
      text-align: center;
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      margin-bottom: 4px;
      font-weight: 800;
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      background-color: var(--bg-light);
      color: var(--text-primary);
      text-transform: uppercase;
      transition: border-color 0.2s ease;
    }

    /* FIX: Controlled resizing for Description Textarea to prevent modal breakout */
    .form-group textarea {
      resize: vertical;
      min-height: 65px;
      max-height: 180px;
      max-width: 100%;
      box-sizing: border-box;
      word-break: break-word;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--header-bg);
      background-color: var(--card-bg);
      outline: none;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #4F46E5, #6366F1);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.24);
    }

    .menu-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .menu-btn {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-light);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background-color 0.15s ease;
    }

    .menu-btn:hover {
      background-color: #F1F5F9;
    }

    .menu-btn.danger {
      color: var(--accent-red);
      border-color: rgba(220, 38, 38, 0.2);
      background-color: #FEF2F2;
    }

    .menu-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #jsonFileInput {
      display: none;
    }
  </style>
</head>
<body>

  <!-- VIEW SCREEN -->
  <div class="view-screen">
    <div id="recordsContainer">
      <p class="no-records" id="emptyMessage">NO COLLECTION RECORDS YET. TAP 'ADD ENTRY' TO START.</p>
    </div>
  </div>

  <!-- FLOATING ACTION MENU -->
  <div class="floating-actions">
    <button class="fab fab-main" id="fabMain" type="button" onclick="toggleFloatingMenu()" aria-label="OPEN ACTIONS">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>

    <button class="fab fab-menu" id="fabView" type="button" onclick="switchToViewTab(); closeFloatingMenu(); window.scrollTo({top: 0, behavior: 'smooth'})" aria-label="VIEW COLLECTIONS" title="VIEW">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
    </button>

    <button class="fab fab-menu" id="fabAdd" type="button" onclick="closeFloatingMenu(); openModalForNew()" aria-label="ADD COLLECTION" title="ADD ENTRY">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>

    <button class="fab fab-menu" id="fabMenu" type="button" onclick="closeFloatingMenu(); openMenuModal()" aria-label="OPEN MENU" title="MENU">
      <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
  </div>

  <!-- MODAL ENTRY / EDIT SCREEN -->
  <div class="modal-overlay" id="entryModal">
    <div class="form-card">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2 id="modalTitle">ADD COLLECTION</h2>
      
      <form id="collectionForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="editIndex" value="-1">

        <div class="form-group">
          <label for="collectionDate">COLLECTION DATE</label>
          <input type="date" id="collectionDate" name="collectionDate" required>
        </div>

        <div class="form-group">
          <label for="name">NAME</label>
          <input type="text" id="name" name="name" placeholder="ENTER NAME" required oninput="this.value = this.value.toUpperCase()">
        </div>

        <div class="form-group">
          <label for="amount">AMOUNT (₹)</label>
          <input type="number" id="amount" name="amount" step="0.01" placeholder="0.00" required>
        </div>

        <div class="form-group">
          <label for="type">TYPE</label>
          <input type="text" id="type" name="type" list="type-suggestions" placeholder="TYPE OR SELECT A TYPE" required autocomplete="off" oninput="this.value = this.value.toUpperCase()">
          <datalist id="type-suggestions"></datalist>
        </div>

        <div class="form-group">
          <label for="description">DESCRIPTION</label>
          <textarea id="description" name="description" rows="2" placeholder="ENTER ADDITIONAL DETAILS..." oninput="this.value = this.value.toUpperCase()"></textarea>
        </div>

        <button type="submit" class="submit-btn" id="saveBtn">SAVE ENTRY</button>
      </form>
    </div>
  </div>

  <!-- MENU MODAL SCREEN -->
  <div class="modal-overlay" id="menuModal">
    <div class="form-card">
      <button class="close-btn" onclick="closeMenuModal()">&times;</button>
      <h2>OPTIONS MENU</h2>

      <div class="menu-options">
        
        <button class="menu-btn" onclick="exportJSONBackup()">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          DOWNLOAD JSON BACKUP
        </button>

        <label for="jsonFileInput" class="menu-btn">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          IMPORT JSON FILE
        </label>
        <input type="file" id="jsonFileInput" accept=".json" onchange="importJSONFile(event)">

        <button class="menu-btn" onclick="shareCollectionText()">
          <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
          SHARE TEXT SUMMARY
        </button>

        <button class="menu-btn danger" onclick="clearAllData()">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          CLEAR ALL DATA
        </button>

      </div>
    </div>
  </div>

  <script>
    let collections = [];
    let selectionModePerDate = {};
    const collapsedDates = new Set();
    let pressTimer = null;
    let swipeStart = null;
    let suppressRowClick = false;

    window.onload = function() {
      setDefaultDate();
      loadCollapsedDates();
      loadFromLocalStorage();
    };

    window.addEventListener('pageshow', function() {
      selectionModePerDate = {};
      renderGroupedView();
      document.querySelectorAll('.select-checkbox').forEach(checkbox => {
        checkbox.checked = false;
      });
      document.querySelectorAll('.entry-item.selected').forEach(row => {
        row.classList.remove('selected');
      });
    });

    function setDefaultDate() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('collectionDate').value = today;
    }

    function formatDateToDMY(dateString) {
      const [year, month, day] = dateString.split('-');
      return `${day}-${month}-${year}`;
    }

    function openModalForNew() {
      document.getElementById('editIndex').value = "-1";
      document.getElementById('modalTitle').innerText = "ADD COLLECTION";
      document.getElementById('saveBtn').innerText = "SAVE ENTRY";
      document.getElementById('collectionForm').reset();
      setDefaultDate();
      openModal();
    }

    function openModal() {
      document.getElementById('entryModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('entryModal').style.display = 'none';
      switchToViewTab();
    }

    function openMenuModal() {
      document.getElementById('menuModal').style.display = 'flex';
    }

    function closeMenuModal() {
      document.getElementById('menuModal').style.display = 'none';
      switchToViewTab();
    }

    function toggleFloatingMenu() {
      const mainFab = document.getElementById('fabMain');
      const menuFabs = document.querySelectorAll('.fab-menu');
      const isOpen = mainFab.classList.toggle('open');
      menuFabs.forEach(button => button.classList.toggle('open', isOpen));
      mainFab.setAttribute('aria-label', isOpen ? 'CLOSE ACTIONS' : 'OPEN ACTIONS');
    }

    function closeFloatingMenu() {
      document.getElementById('fabMain').classList.remove('open');
      document.querySelectorAll('.fab-menu').forEach(button => button.classList.remove('open'));
      document.getElementById('fabMain').setAttribute('aria-label', 'OPEN ACTIONS');
    }

    function switchToViewTab() {
      closeFloatingMenu();
    }

    window.onclick = function(event) {
      const entryModal = document.getElementById('entryModal');
      const menuModal = document.getElementById('menuModal');
      if (event.target === entryModal) closeModal();
      if (event.target === menuModal) closeMenuModal();
    };

    function handleFormSubmit(event) {
      event.preventDefault();

      const date = document.getElementById('collectionDate').value;
      const name = document.getElementById('name').value.trim().toUpperCase();
      const amount = parseFloat(document.getElementById('amount').value);
      const type = document.getElementById('type').value.trim().toUpperCase();
      const description = document.getElementById('description').value.trim().toUpperCase();
      const editIndex = parseInt(document.getElementById('editIndex').value);

      const entry = {
        date,
        name,
        amount,
        type,
        description,
        excludeFromTotal: editIndex >= 0 && editIndex < collections.length
          ? !!collections[editIndex].excludeFromTotal
          : false
      };

      if (editIndex >= 0 && editIndex < collections.length) {
        collections[editIndex] = entry;
      } else {
        collections.push(entry);
      }

      localStorage.setItem('daily_collections', JSON.stringify(collections));

      updateDatalistSuggestions(type);
      renderGroupedView();

      document.getElementById('collectionForm').reset();
      setDefaultDate();
      closeModal();
    }

    function loadFromLocalStorage() {
      const stored = localStorage.getItem('daily_collections');
      if (stored) {
        try {
          collections = JSON.parse(stored);
          collections.forEach(item => updateDatalistSuggestions(item.type));
          renderGroupedView();
        } catch (e) {
          console.error("Error reading stored records:", e);
        }
      }
    }

    function editEntry(index) {
      const item = collections[index];
      if (!item) return;

      document.getElementById('editIndex').value = index;
      document.getElementById('collectionDate').value = item.date;
      document.getElementById('name').value = item.name;
      document.getElementById('amount').value = item.amount;
      document.getElementById('type').value = item.type;
      document.getElementById('description').value = item.description || '';

      document.getElementById('modalTitle').innerText = "EDIT COLLECTION";
      document.getElementById('saveBtn').innerText = "UPDATE ENTRY";

      openModal();
    }

    function deleteSingleEntry(index) {
      if (confirm("ARE YOU SURE YOU WANT TO DELETE THIS RECORD?")) {
        collections.splice(index, 1);
        localStorage.setItem('daily_collections', JSON.stringify(collections));
        renderGroupedView();
      }
    }

    function toggleExcludeFromTotal(index) {
      const item = collections[index];
      if (!item) return;

      item.excludeFromTotal = !item.excludeFromTotal;
      localStorage.setItem('daily_collections', JSON.stringify(collections));
      closeSwipeRows();
      renderGroupedView();
    }

    function startSwipe(event) {
      if (event.touches.length !== 1) return;
      const touch = event.touches[0];
      swipeStart = { x: touch.clientX, y: touch.clientY };
    }

    function moveSwipe(event) {
      if (!swipeStart || event.touches.length !== 1) return;
      const touch = event.touches[0];
      const deltaX = touch.clientX - swipeStart.x;
      const deltaY = touch.clientY - swipeStart.y;

      if (Math.abs(deltaX) > 10 && Math.abs(deltaX) > Math.abs(deltaY)) {
        cancelLongPress();
      }
    }

    function endSwipe(event, container) {
      cancelLongPress();
      if (!swipeStart || !event.changedTouches.length) {
        swipeStart = null;
        return;
      }

      const touch = event.changedTouches[0];
      const deltaX = touch.clientX - swipeStart.x;
      const deltaY = touch.clientY - swipeStart.y;
      if (Math.abs(deltaX) >= 55 && Math.abs(deltaX) > Math.abs(deltaY)) {
        closeSwipeRows();
        if (deltaX > 0 && container.querySelector('.swipe-actions')) {
          container.classList.add('swipe-open');
        }
        suppressRowClick = true;
        setTimeout(() => { suppressRowClick = false; }, 500);
      }
      swipeStart = null;
    }

    function closeSwipeRows() {
      document.querySelectorAll('.entry-swipe-container.swipe-open').forEach(row => {
        row.classList.remove('swipe-open');
      });
    }

    /* Long Press Event Handlers */
    function startLongPress(date, originalIndex) {
      pressTimer = setTimeout(() => {
        selectionModePerDate[date] = true;
        renderGroupedView();
        
        setTimeout(() => {
          const safeDateClass = date.replace(/-/g, '_');
          const checkbox = document.querySelector(`.checkbox-date-${safeDateClass}[value="${originalIndex}"]`);
          if (checkbox) {
            checkbox.checked = true;
            toggleRowHighlight(checkbox);
          }
        }, 50);
      }, 500);
    }

    function cancelLongPress() {
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
    }

    function disableSelectionMode(date) {
      selectionModePerDate[date] = false;
      renderGroupedView();
    }

    function toggleRowHighlight(checkbox) {
      const row = checkbox.closest('.entry-item');
      if (checkbox.checked) {
        row.classList.add('selected');
      } else {
        row.classList.remove('selected');
      }
    }

    function handleRowClick(event, date, originalIndex) {
      if (suppressRowClick) {
        suppressRowClick = false;
        return;
      }
      if (selectionModePerDate[date]) {
        const safeDateClass = date.replace(/-/g, '_');
        const checkbox = document.querySelector(`.checkbox-date-${safeDateClass}[value="${originalIndex}"]`);
        if (checkbox && event.target !== checkbox) {
          checkbox.checked = !checkbox.checked;
          toggleRowHighlight(checkbox);
        }
      }
    }

    function toggleSelectAllDate(date) {
      const checkboxes = document.querySelectorAll(`.checkbox-date-${date}`);
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);

      checkboxes.forEach(cb => {
        cb.checked = !allChecked;
        toggleRowHighlight(cb);
      });
    }

    function deleteSelectedForDate(date) {
      const checkboxes = document.querySelectorAll(`.checkbox-date-${date}:checked`);
      if (checkboxes.length === 0) {
        alert("NO ITEMS SELECTED TO DELETE.");
        return;
      }

      if (confirm(`ARE YOU SURE YOU WANT TO DELETE ${checkboxes.length} SELECTED RECORD(S)?`)) {
        const indicesToDelete = Array.from(checkboxes).map(cb => parseInt(cb.value));
        collections = collections.filter((_, idx) => !indicesToDelete.includes(idx));

        localStorage.setItem('daily_collections', JSON.stringify(collections));
        selectionModePerDate[date] = false;
        renderGroupedView();
      }
    }

    function exportJSONBackup() {
      if (collections.length === 0) {
        alert("NO RECORDS TO EXPORT.");
        return;
      }

      const jsonString = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(collections, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", jsonString);
      downloadAnchor.setAttribute("download", `collections_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      closeMenuModal();
    }

    function importJSONFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (Array.isArray(importedData)) {
            collections = importedData;
            localStorage.setItem('daily_collections', JSON.stringify(collections));
            collections.forEach(item => updateDatalistSuggestions(item.type));
            renderGroupedView();
            alert("COLLECTION DATA IMPORTED SUCCESSFULLY!");
            closeMenuModal();
          } else {
            alert("INVALID JSON FORMAT.");
          }
        } catch (err) {
          alert("ERROR READING JSON FILE.");
        }
      };
      reader.readAsText(file);
    }

    function shareCollectionText() {
      if (collections.length === 0) {
        alert("NO RECORDS TO SHARE.");
        return;
      }

      /* -------------------------------------------------------------------- */
      /*  Build a **markdown‑formatted** collection report                  */
      /* -------------------------------------------------------------------- */
      let summaryText = "# 📊 DAILY COLLECTION REPORT\\n\\n";

      // Group entries by date
      const grouped = collections.reduce((acc, item) => {
        (acc[item.date] = acc[item.date] || []).push(item);
        return acc;
      }, {});

      // Sort dates newest → oldest
      const sortedDates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));

      // Assemble the markdown report
      sortedDates.forEach(date => {
        const items = grouped[date];
        const dayTotal = items.reduce((sum, i) => sum + i.amount, 0);
        // Date header
        summaryText += `## 📅 ${formatDateToDMY(date)}\\n`;
        summaryText += `**Total:** ₹${dayTotal.toFixed(2)}\\n\\n`;
        // Table header
        summaryText += `| Name | Amount | Type | Description |\\n`;
        summaryText += `| ---- | ------ | ---- | ----------- |\\n`;
        items.forEach(item => {
          const desc = item.description ? item.description.replace(/[|]/g, ' ') : '';
          summaryText += `| ${item.name} | ₹${item.amount.toFixed(2)} | ${item.type} | ${desc} |\\n`;
        });
        summaryText += "\\n"; // blank line between dates
      });

      // Helper function to handle fallback hidden textarea copy
      function fallbackCopyText(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        
        // Ensure textarea is hidden and out of viewport
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        textArea.style.top = "0";
        document.body.appendChild(textArea);
        
        textArea.focus();
        textArea.select();

        let successful = false;
        try {
          successful = document.execCommand('copy');
        } catch (err) {
          console.error('Fallback copy failed:', err);
        }

        document.body.removeChild(textArea);
        return successful;
      }

      // Multi-fallback Copy / Share flow
      if (navigator.share) {
        navigator.share({
          title: 'Daily Collection Summary',
          text: summaryText
        }).then(() => {
          closeMenuModal();
        }).catch((err) => {
          // If native share is rejected or unsupported by context, attempt clipboard standard/fallback copy
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(summaryText).then(() => {
              alert("COPIED TO CLIPBOARD!");
              closeMenuModal();
            }).catch(() => {
              if (fallbackCopyText(summaryText)) {
                alert("COPIED TO CLIPBOARD!");
              } else {
                alert("FAILED TO COPY TEXT.");
              }
              closeMenuModal();
            });
          } else {
            if (fallbackCopyText(summaryText)) {
              alert("COPIED TO CLIPBOARD!");
            } else {
              alert("FAILED TO COPY TEXT.");
            }
            closeMenuModal();
          }
        });
      } else if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(summaryText).then(() => {
          alert("COPIED TO CLIPBOARD!");
          closeMenuModal();
        }).catch(() => {
          if (fallbackCopyText(summaryText)) {
            alert("COPIED TO CLIPBOARD!");
          } else {
            alert("FAILED TO COPY TEXT.");
          }
          closeMenuModal();
        });
      } else {
        if (fallbackCopyText(summaryText)) {
          alert("COPIED TO CLIPBOARD!");
        } else {
          alert("FAILED TO COPY TEXT.");
        }
        closeMenuModal();
      }
    }

    function clearAllData() {
      if (confirm("ARE YOU SURE YOU WANT TO CLEAR ALL SAVED DATA? THIS ACTION CANNOT BE UNDONE!")) {
        collections = [];
        localStorage.removeItem('daily_collections');
        collapsedDates.clear();
        localStorage.removeItem('collapsed_collection_dates');
        renderGroupedView();
        closeMenuModal();
      }
    }

    function updateDatalistSuggestions(type) {
      const dataList = document.getElementById('type-suggestions');
      if (type) {
        let exists = Array.from(dataList.options).some(
          option => option.value.toUpperCase() === type
        );
        if (!exists) {
          const newOption = document.createElement('option');
          newOption.value = type;
          dataList.appendChild(newOption);
        }
      }
    }

    function loadCollapsedDates() {
      const stored = localStorage.getItem('collapsed_collection_dates');
      if (!stored) return;

      try {
        const dates = JSON.parse(stored);
        if (Array.isArray(dates)) {
          collapsedDates.clear();
          dates.forEach(date => collapsedDates.add(date));
        }
      } catch (e) {
        console.error("Error reading collapsed card state:", e);
      }
    }

    function saveCollapsedDates() {
      localStorage.setItem('collapsed_collection_dates', JSON.stringify([...collapsedDates]));
    }

    function toggleGroupCard(date) {
      if (collapsedDates.has(date)) {
        collapsedDates.delete(date);
      } else {
        collapsedDates.add(date);
      }
      saveCollapsedDates();
      renderGroupedView();
    }

    function handleHeaderKeydown(event, date) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleGroupCard(date);
      }
    }

    function renderGroupedView() {
      const container = document.getElementById('recordsContainer');
      container.innerHTML = '';

      if (collections.length === 0) {
        container.innerHTML = '<p class="no-records" id="emptyMessage">NO COLLECTION RECORDS YET. TAP \'ADD ENTRY\' TO START.</p>';
        return;
      }

      const grouped = {};
      collections.forEach((item, originalIndex) => {
        if (!grouped[item.date]) {
          grouped[item.date] = {
            items: [],
            total: 0
          };
        }
        grouped[item.date].items.unshift({ ...item, originalIndex });
        if (!item.excludeFromTotal) {
          grouped[item.date].total += item.amount;
        }
      });

      const sortedDates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));

      sortedDates.forEach(date => {
        const group = grouped[date];
        const isSelectMode = !!selectionModePerDate[date];
        const isCollapsed = collapsedDates.has(date);
        const safeDateClass = date.replace(/-/g, '_');

        const groupCard = document.createElement('div');
        groupCard.className = 'date-group-card';

        let entriesHTML = '';
        group.items.forEach(item => {
          entriesHTML += `
            <div class="entry-swipe-container"
                 ontouchstart="startSwipe(event)"
                 ontouchmove="moveSwipe(event)"
                 ontouchend="endSwipe(event, this)"
                 ontouchcancel="endSwipe(event, this)">
              ${!isSelectMode ? `
              <div class="swipe-actions">
                <button class="swipe-action toggle-total ${item.excludeFromTotal ? 'excluded' : ''}" onclick="event.stopPropagation(); toggleExcludeFromTotal(${item.originalIndex})" aria-label="${item.excludeFromTotal ? 'SHOW IN CARD TOTAL' : 'HIDE FROM CARD TOTAL'}">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><line x1="7" y1="12" x2="17" y2="12"></line></svg>
                  <span>${item.excludeFromTotal ? 'SHOW' : 'HIDE'}</span>
                </button>
                <button class="swipe-action edit-action" onclick="event.stopPropagation(); editEntry(${item.originalIndex})" aria-label="EDIT ENTRY">
                  <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1-1 4 9.5-9.5z"></path></svg>
                  <span>EDIT</span>
                </button>
                <button class="swipe-action delete-action" onclick="event.stopPropagation(); deleteSingleEntry(${item.originalIndex})" aria-label="DELETE ENTRY">
                  <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                  <span>DELETE</span>
                </button>
              </div>
              ` : ''}
              <div class="entry-item" 
                 onmousedown="startLongPress('${date}', ${item.originalIndex})"
                 onmouseup="cancelLongPress()"
                 mouseleave="cancelLongPress()"
                 ontouchstart="startLongPress('${date}', ${item.originalIndex})"
                 ontouchend="cancelLongPress()"
                 onclick="handleRowClick(event, '${date}', ${item.originalIndex})">
              
              <div class="entry-left">
                <input type="checkbox" autocomplete="off"
                       class="select-checkbox checkbox-date-${safeDateClass} ${isSelectMode ? 'show' : ''}" 
                       value="${item.originalIndex}" 
                       onchange="toggleRowHighlight(this)">
                <div class="entry-info">
                  <h4>${item.name}</h4>
                  <div class="type-badge">${item.type}${item.description ? ' • ' + item.description : ''}</div>
                </div>
              </div>

              <div class="entry-right">
                <div class="entry-amount">₹${item.amount.toFixed(2)}</div>
              </div>
            </div>
            </div>
          `;
        });

        const formattedDate = formatDateToDMY(date);

        groupCard.innerHTML = `
          <div class="date-header" onclick="toggleGroupCard('${date}')" onkeydown="handleHeaderKeydown(event, '${date}')" role="button" tabindex="0" aria-expanded="${isCollapsed ? 'false' : 'true'}">
            <div class="date-header-left">
              <button class="collapse-toggle ${isCollapsed ? 'collapsed' : ''}" onclick="event.stopPropagation(); toggleGroupCard('${date}')" onkeydown="event.stopPropagation()" aria-label="${isCollapsed ? 'EXPAND' : 'COLLAPSE'} ${formattedDate}" title="${isCollapsed ? 'EXPAND' : 'COLLAPSE'}">
                <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </button>
              <span class="date-title">${formattedDate}</span>
            </div>
            <div class="date-header-right">
              <span class="total-amount">₹${group.total.toFixed(2)}</span>
              <span class="card-count">${group.items.length}</span>
            </div>
          </div>

          <div class="bulk-actions-bar ${isSelectMode && !isCollapsed ? 'active' : ''}">
            <button class="btn-bulk-action btn-cancel-select" onclick="disableSelectionMode('${date}')">CANCEL</button>
            <button class="btn-bulk-action btn-select-all" onclick="toggleSelectAllDate('${safeDateClass}')">SELECT ALL</button>
            <button class="btn-bulk-action btn-delete-selected" onclick="deleteSelectedForDate('${safeDateClass}')">DELETE SELECTED</button>
          </div>

          <div class="entry-list ${isCollapsed ? 'collapsed' : ''}">
            ${entriesHTML}
          </div>
        `;

        container.appendChild(groupCard);
      });
    }
  </script>

</body>
</html>
